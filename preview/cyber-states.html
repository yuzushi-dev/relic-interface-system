<!DOCTYPE html><html data-theme="dark" data-brand="vivokey" data-skin="cyber"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ris/css/ris-tokens.css">
<link rel="stylesheet" href="../ris/css/ris.css">
<link rel="stylesheet" href="../ris/css/ris-fx.css">
<link rel="stylesheet" href="../ris/css/ris-skin-cyber.css">
<style>body{padding:22px}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}</style>
</head><body class="ris ris-grid-bg">
  <span class="ris-label" style="display:block;margin-bottom:10px">Stati attivi · moto = enhancement + label · fermi sotto reduced-motion</span>
  <div class="g">
    <div class="ris-panel ris-acquiring"><div class="ris-panel-body">
      <span class="ris-label" style="color:var(--ris-red)">Live acquisition</span>
      <p class="ris-small" style="margin:6px 0 10px">.ris-acquiring</p>
      <span class="ris-rec">Rec · 00:42</span>
    </div></div>
    <div class="ris-panel"><div class="ris-panel-body">
      <span class="ris-label">Playing</span>
      <p class="ris-small" style="margin:6px 0 10px">.ris-playing</p>
      <span class="ris-row" style="gap:8px"><span class="ris-playing"><i></i><i></i><i></i><i></i></span><span class="ris-mono">EEG live</span></span>
    </div></div>
    <div class="ris-panel ris-scan" style="min-height:108px;grid-column:span 2"><div class="ris-panel-body">
      <span class="ris-label" style="color:var(--ris-cyan)">Scanning</span>
      <p class="ris-small" style="margin:6px 0 0">.ris-scan · sweep · scan BLE / connessione / ricerca</p>
    </div></div>
  </div>
</body></html>
