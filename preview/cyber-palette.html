<!DOCTYPE html><html data-theme="dark" data-brand="omnikon" data-skin="cyber"><head><meta charset="utf-8">
<link rel="stylesheet" href="../ris/css/ris-tokens.css">
<link rel="stylesheet" href="../ris/css/ris.css">
<link rel="stylesheet" href="../ris/css/ris-skin-cyber.css">
<style>
  body{padding:22px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sw{border:1px solid var(--ris-line)}
  .sw .c{height:54px;background:var(--c)}
  .sw .m{padding:7px 9px;background:var(--ris-surface-1);font-family:var(--ris-font-mono);font-size:10px;color:var(--ris-fg3)}
  .sw .m b{display:block;color:var(--ris-fg1);font-weight:500}
</style>
</head><body class="ris ris-grid-bg">
  <p class="ris-eyebrow" style="display:block;margin-bottom:12px">neon ri-saturato · temperato WCAG AA su near-black · rosso strutturale</p>
  <div class="grid">
    <div class="sw"><div class="c" style="--c:var(--ris-red-fill)"></div><div class="m"><b>red-fill</b>#ff003c</div></div>
    <div class="sw"><div class="c" style="--c:var(--ris-cyan-fill)"></div><div class="m"><b>cyan-fill</b>#00e5ff</div></div>
    <div class="sw"><div class="c" style="--c:var(--ris-green-fill)"></div><div class="m"><b>green-fill</b>#00e57e</div></div>
    <div class="sw"><div class="c" style="--c:var(--ris-yellow-fill)"></div><div class="m"><b>yellow-fill</b>#ffe23a</div></div>
    <div class="sw"><div class="c" style="--c:var(--ris-violet)"></div><div class="m"><b>violet</b>#b08aff</div></div>
    <div class="sw"><div class="c" style="--c:var(--ris-magenta)"></div><div class="m"><b>magenta</b>#ff5fd2</div></div>
    <div class="sw"><div class="c" style="--c:var(--ris-orange)"></div><div class="m"><b>orange</b>#ff9f4a</div></div>
    <div class="sw"><div class="c" style="--c:var(--ris-line-strong)"></div><div class="m"><b>line-strong</b>rosso</div></div>
  </div>
</body></html>
