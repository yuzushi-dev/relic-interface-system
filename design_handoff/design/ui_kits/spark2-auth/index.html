<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark2 Auth Gate — RIS Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../relic.css">
<style>
  html, body { height: 100%; margin: 0; background: var(--ris-void); overflow: hidden; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .phone { position: relative; width: 390px; height: 844px; background: #000; border: 1px solid var(--ris-line-strong); padding: 10px;
    box-shadow: 0 0 0 2px #0c0f11, 0 30px 80px rgba(0,0,0,.7); clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
  .screen { position: relative; width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; background: var(--ris-bg); border: 1px solid var(--ris-line); }
  .notch { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: #1a1f22; border: 1px solid var(--ris-line-strong); z-index: 30; }
  ::-webkit-scrollbar { width: 0; }
  button { font-family: inherit; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinr { to { transform: rotate(-360deg); } }
  @keyframes pulse { 0%,100% { transform: scale(.96); } 50% { transform: scale(1.04); } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="ris">
<div id="stage"><div class="phone" id="phone"><div class="notch"></div><div class="screen"><div id="root" style="min-height:100%"></div></div></div></div>

<script type="text/babel" data-presets="react">
(() => {
const { useState, useEffect, useRef } = React;
const MONO = 'var(--ris-font-mono)';

// level → color (maps the app's CP2077 palette onto RIS tokens)
const LV = {
  IDLE:            { c: 'var(--ris-line-strong)', sym: '○', label: 'TAP\nIMPLANT' },
  ARMED:           { c: 'var(--ris-amber)',       sym: '■', label: 'ARMED\nTAP NOW' },
  SCANNING:        { c: '#3a6fff',                sym: '◎', label: 'READING\nCHIP' },
  DENIED:          { c: 'var(--ris-red)',         sym: '✕', label: 'ACCESS\nDENIED' },
  PRESENCE:        { c: 'var(--ris-orange)',      sym: '◈', label: 'PRESENCE\nCONFIRMED' },
  OFFLINE_2FA:     { c: 'var(--ris-amber)',       sym: '⊕', label: 'OFFLINE 2FA\nVERIFIED' },
  ONLINE_ATTESTED: { c: 'var(--ris-cyan)',        sym: '★', label: 'KEY-1\nATTESTED' },
};
const LADDER = [['DENIED','DENIED'],['PRESENCE','PRESENCE'],['2FA','OFFLINE_2FA'],['ATTESTED','ONLINE_ATTESTED']];
const LADDER_RANK = { DENIED: 0, PRESENCE: 1, OFFLINE_2FA: 2, ONLINE_ATTESTED: 3 };

function ScanRing({ level }) {
  const { c, sym, label } = LV[level] || LV.IDLE;
  const spinning = level === 'IDLE' || level === 'ARMED' || level === 'SCANNING';
  const idle = level === 'IDLE';
  return (
    <div style={{ position: 'relative', height: 210, display: 'flex', alignItems: 'center', justifyContent: 'center' }} className="ris-scanlines">
      {/* corner ticks */}
      {[0,90,180,270].map(a => (
        <span key={a} style={{ position: 'absolute', width: 16, height: 2, background: c, opacity: .55,
          transform: `rotate(${a}deg) translate(74px) rotate(90deg)` }} />
      ))}
      {/* faint outer rings */}
      {[1,1.13,1.26].map((m,i) => (
        <span key={i} style={{ position: 'absolute', width: 132*m, height: 132*m, borderRadius: '50%', border: '1px solid var(--ris-line)', opacity: .35 - i*0.1 }} />
      ))}
      {/* rotating sweep arc */}
      {spinning && <span style={{ position: 'absolute', width: 150, height: 150, borderRadius: '50%', border: '2px solid transparent', borderTopColor: level==='ARMED'?'var(--ris-amber)':level==='SCANNING'?'#3a6fff':'var(--ris-line-strong)', animation: 'spin 3s linear infinite' }} />}
      {spinning && <span style={{ position: 'absolute', width: 122, height: 122, borderRadius: '50%', border: '1px solid transparent', borderTopColor: level==='SCANNING'?'#3a6fff':'var(--ris-line-strong)', opacity: .5, animation: 'spinr 4s linear infinite' }} />}
      {/* main ring */}
      <span style={{ position: 'absolute', width: 150, height: 150, borderRadius: '50%', border: (idle?'1px':'3px')+' solid '+c, opacity: idle?.4:.9, boxShadow: idle?'none':'0 0 22px '+c+'44', animation: level==='ARMED'||level==='SCANNING'?'pulse 1.1s ease-in-out infinite':'none' }} />
      {/* center */}
      <div style={{ position: 'relative', textAlign: 'center', color: c }}>
        <div style={{ fontFamily: MONO, fontSize: 40, lineHeight: 1, opacity: idle?.5:1 }}>{sym}</div>
        <div style={{ fontFamily: MONO, fontSize: 11, letterSpacing: '.12em', marginTop: 8, opacity: idle?.45:.9, whiteSpace: 'pre-line', lineHeight: 1.4 }}>{label}</div>
      </div>
    </div>
  );
}

function Ladder({ level }) {
  const rank = LADDER_RANK[level];
  return (
    <div style={{ display: 'flex', gap: 3, padding: '0 12px' }}>
      {LADDER.map(([lbl, key]) => {
        const active = level === key;
        const reached = rank !== undefined && LADDER_RANK[key] <= rank && key !== 'DENIED';
        const c = LV[key].c;
        const show = active || reached;
        return (
          <div key={key} style={{ flex: 1, textAlign: 'center', padding: '7px 0', border: '1px solid '+(show?c:'var(--ris-line)'), background: show?c+'1f':'transparent',
            fontFamily: MONO, fontSize: 10, letterSpacing: '.06em', color: show?c:'var(--ris-fg4)', fontWeight: active?700:400 }}>{lbl}</div>
        );
      })}
    </div>
  );
}

function Steps({ steps }) {
  return (
    <div style={{ margin: '0 12px', border: '1px solid var(--ris-line)', background: 'var(--ris-surface-1)' }}>
      {steps.map((s, i) => {
        const c = s.ok === true ? 'var(--ris-amber)' : s.ok === false ? 'var(--ris-red)' : 'var(--ris-line-strong)';
        return (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '11px 12px', borderBottom: i<2?'1px solid var(--ris-line-faint)':'none', borderLeft: '3px solid '+c }}>
            <span style={{ fontFamily: MONO, fontSize: 18, color: c, width: 18, textAlign: 'center' }}>{s.icon}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontFamily: MONO, fontSize: 11, letterSpacing: '.08em', color: s.ok==null?'var(--ris-fg3)':'var(--ris-fg1)', fontWeight: s.ok==null?400:700 }}>{s.label}</div>
              <div style={{ fontFamily: MONO, fontSize: 10, color: c, marginTop: 2, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.detail}</div>
            </div>
            {s.ok != null && <span style={{ fontFamily: MONO, fontSize: 11, fontWeight: 700, color: c }}>{s.ok?'[ OK ]':'[FAIL]'}</span>}
          </div>
        );
      })}
    </div>
  );
}

const MODES = ['AUTH', 'ENROLL', 'READ'];
const DEFAULT_STEPS = [
  { icon: '◈', label: 'FACTOR-1', detail: 'presence · UID · monotonic counter', ok: null },
  { icon: '⊕', label: 'FACTOR-2', detail: 'PIN · scrypt · AES-256-GCM', ok: null },
  { icon: '★', label: 'BOOSTER',  detail: 'VivoKey /validate · key-1', ok: null },
];

function App() {
  const [mode, setMode] = useState('AUTH');
  const [state, setState] = useState('IDLE');     // IDLE / ARMED / SCANNING / RESULT
  const [level, setLevel] = useState('IDLE');
  const [pin, setPin] = useState('');
  const [online, setOnline] = useState(false);
  const [steps, setSteps] = useState(DEFAULT_STEPS);
  const [log, setLog] = useState(['> SPARK-2∷AUTH initialised.', '> NFC ready.']);
  const logRef = useRef(null);
  const append = (...lines) => setLog(l => [...l, ...lines]);

  useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [log]);

  const banner = {
    IDLE: 'SELECT MODE AND ARM  >>>>', ARMED: '◉  ARMED · FLAT ON NFC · HOLD STILL  >>>>',
    SCANNING: '////  READING CHIP  ////',
    RESULT: { DENIED: '▓▓  ACCESS DENIED  ▓▓', PRESENCE: '>>  PRESENCE CONFIRMED', OFFLINE_2FA: '>>  OFFLINE 2FA VERIFIED', ONLINE_ATTESTED: '>>  KEY-1 ATTESTED  ★' }[level] || 'RESULT',
  }[state];
  const bannerC = state==='IDLE'?'var(--ris-line-strong)':state==='ARMED'?'var(--ris-amber)':state==='SCANNING'?'#3a6fff':LV[level].c;

  const arm = () => {
    if (state === 'ARMED') { setState('IDLE'); setLevel('IDLE'); setSteps(DEFAULT_STEPS); append('> disarmed'); return; }
    if (mode !== 'READ' && mode === 'ENROLL' && pin.length < 6) { append('! PIN must be ≥6 chars (enroll requires strong PIN)'); return; }
    setState('ARMED'); setLevel('ARMED');
    append('> ARMED  mode='+mode+'  online='+(mode==='AUTH'?online:false), '  bring implant close to NFC reader');
    // simulate a tap
    setTimeout(() => runScan(), 1700);
  };

  const runScan = () => {
    setState('SCANNING'); setLevel('SCANNING'); setSteps(DEFAULT_STEPS);
    append('', '─────────────────────────────', '> reading SUN…');
    setTimeout(() => resolve(), 1400);
  };

  const resolve = () => {
    const uid = 'A1B2C3D4'; const ctr = 1041;
    if (mode === 'READ') {
      setSteps([
        { icon:'◈', label:'FACTOR-1', detail:`UID=${uid} CTR=${ctr}`, ok:true },
        { icon:'⊕', label:'FACTOR-2', detail:'not requested', ok:null },
        { icon:'★', label:'BOOSTER',  detail:'not requested', ok:null },
      ]);
      setLevel('PRESENCE'); setState('RESULT');
      append('◈ READ  uid='+uid+'  ctr='+ctr);
    } else if (mode === 'ENROLL') {
      setSteps([
        { icon:'◈', label:'FACTOR-1', detail:`UID=${uid} read OK`, ok:true },
        { icon:'⊕', label:'FACTOR-2', detail:'vault sealed · scrypt+AES-256-GCM', ok:true },
        { icon:'★', label:'BOOSTER',  detail:'n/a at enroll', ok:null },
      ]);
      setLevel('OFFLINE_2FA'); setState('RESULT');
      append('◈ ENROLLED  uid='+uid, '  factor-2 vault sealed (scrypt n=2^17 · AES-256-GCM)');
    } else { // AUTH
      const hasPin = pin.length > 0;
      const pinOk = pin.length >= 6;
      const f2ok = hasPin && pinOk;
      const attested = f2ok && online;
      const lvl = !hasPin ? 'PRESENCE' : !pinOk ? 'DENIED' : attested ? 'ONLINE_ATTESTED' : 'OFFLINE_2FA';
      setSteps([
        { icon:'◈', label:'FACTOR-1', detail:`UID enrolled · CTR=${ctr} anti-replay OK`, ok:true },
        { icon:'⊕', label:'FACTOR-2', detail: !hasPin?'no PIN — PRESENCE only': pinOk?'PBKDF2+AES-256-GCM unseal OK':'wrong PIN', ok: !hasPin?null:pinOk },
        { icon:'★', label:'BOOSTER',  detail: !online?'offline mode — opt-in only': attested?'VivoKey /validate · key-1 verified':'key-1 unavailable', ok: !online?null:attested },
      ]);
      setLevel(lvl); setState('RESULT');
      append('▶ '+lvl+'   uid='+uid+'  ctr='+ctr);
    }
  };

  const showPin = mode !== 'READ';
  const showOnline = mode === 'AUTH';

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%', background: 'var(--ris-bg)' }}>
      {/* header */}
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', padding: '14px 16px', background: 'var(--ris-surface-1)', borderBottom: '1px solid var(--ris-line)' }}>
        <div>
          <div style={{ fontFamily: MONO, fontSize: 19, fontWeight: 700, color: 'var(--ris-amber)', letterSpacing: '.04em' }}>SPARK-2∷AUTH</div>
          <div style={{ fontFamily: MONO, fontSize: 9, color: 'var(--ris-fg3)', marginTop: 3 }}>offline-first possession gate + pin 2fa</div>
        </div>
        <div style={{ textAlign: 'right', fontFamily: MONO, fontSize: 9, color: 'var(--ris-fg4)', lineHeight: 1.5 }}>SYS:v1.0<br/>RESEARCH</div>
      </div>

      {/* mode tabs */}
      <div style={{ display: 'flex', background: 'var(--ris-surface-1)', borderBottom: '1px solid var(--ris-line)' }}>
        {MODES.map((m, i) => {
          const on = mode === m;
          return (
            <button key={m} onClick={() => { setMode(m); if (state==='RESULT'||state==='ARMED') { setState('IDLE'); setLevel('IDLE'); setSteps(DEFAULT_STEPS); } }}
              style={{ position: 'relative', flex: 1, padding: '13px 0', background: on?'var(--ris-amber-glow)':'transparent', border: 'none', borderLeft: i>0?'1px solid var(--ris-line)':'none', cursor: 'pointer',
                fontFamily: MONO, fontSize: 13, fontWeight: on?700:400, letterSpacing: '.08em', color: on?'var(--ris-amber)':'var(--ris-fg3)' }}>
              {m}
              {on && <span style={{ position: 'absolute', left: 8, right: 8, bottom: 0, height: 3, background: 'var(--ris-amber)' }} />}
            </button>
          );
        })}
      </div>

      <ScanRing level={level} />

      {/* status banner */}
      <div style={{ margin: '0', padding: '9px 12px', textAlign: 'center', fontFamily: MONO, fontSize: 11, letterSpacing: '.12em', color: bannerC, background: bannerC.startsWith('#')||bannerC.startsWith('var')?'transparent':'transparent', borderTop: '1px solid var(--ris-line-faint)', borderBottom: '1px solid var(--ris-line-faint)', position: 'relative' }}>
        <span style={{ position: 'absolute', inset: 0, background: bannerC, opacity: .12 }} />
        <span style={{ position: 'relative' }}>{banner}</span>
      </div>

      <div style={{ height: 12 }} />
      <Ladder level={level} />
      <div style={{ height: 12 }} />
      <Steps steps={steps} />

      {/* controls */}
      <div style={{ margin: '14px 0 0', padding: '12px 14px', background: 'var(--ris-surface-1)' }}>
        {showPin && <>
          <div style={{ fontFamily: MONO, fontSize: 9, color: 'var(--ris-fg3)', marginBottom: 4 }}>KNOWLEDGE FACTOR · PIN</div>
          <input className="ris-input" type="password" inputMode="numeric" value={pin} onChange={e => setPin(e.target.value.replace(/\D/g,''))} placeholder="enter PIN  (≥6 digits)"
            style={{ fontFamily: MONO, marginBottom: 10 }} />
        </>}
        {showOnline && (
          <label style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 12, cursor: 'pointer' }} onClick={() => setOnline(o => !o)}>
            <span style={{ width: 18, height: 18, border: '1px solid '+(online?'var(--ris-amber)':'var(--ris-line-strong)'), background: online?'var(--ris-amber-glow)':'var(--ris-void)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--ris-amber)', fontFamily: MONO, fontSize: 12 }}>{online?'✓':''}</span>
            <span style={{ fontFamily: MONO, fontSize: 11, color: 'var(--ris-fg3)' }}>ONLINE BOOSTER · VivoKey /validate · key-1</span>
          </label>
        )}
        <button onClick={arm} disabled={state==='SCANNING'}
          style={{ width: '100%', padding: '14px', cursor: state==='SCANNING'?'not-allowed':'pointer', fontFamily: MONO, fontSize: 13, fontWeight: 700, letterSpacing: '.08em',
            clipPath: 'polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px))',
            border: '1px solid '+(state==='SCANNING'?'#3a6fff':'var(--ris-amber)'),
            background: state==='ARMED'?'var(--ris-amber)':'transparent',
            color: state==='ARMED'?'var(--ris-fg-invert)':state==='SCANNING'?'#3a6fff':'var(--ris-amber)' }}>
          {state==='ARMED' ? '■  ARMED · TAP IMPLANT' : state==='SCANNING' ? '////  SCANNING  ////' : '◉  ARM — '+mode}
        </button>
      </div>

      {/* netlog */}
      <div style={{ padding: '8px 12px 16px' }}>
        <div style={{ fontFamily: MONO, fontSize: 9, color: 'var(--ris-fg4)', padding: '4px 0 2px' }}>NETLOG  ::::</div>
        <div ref={logRef} style={{ height: 110, overflow: 'auto', background: 'var(--ris-surface-1)', border: '1px solid var(--ris-line)', padding: '8px 10px', fontFamily: MONO, fontSize: 11, color: 'var(--ris-fg2)', lineHeight: 1.6, whiteSpace: 'pre-wrap' }}>
          {log.map((l, i) => <div key={i} style={{ color: l.startsWith('!')?'var(--ris-red)':l.startsWith('▶')||l.startsWith('◈')?'var(--ris-amber)':'var(--ris-fg2)' }}>{l}</div>)}
        </div>
      </div>
    </div>
  );
}

// scale phone to viewport
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
function fit() { const p = document.getElementById('phone'); const s = Math.min(1, (window.innerHeight-40)/844, (window.innerWidth-40)/390); p.style.transform = 'scale('+s+')'; }
window.addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
