<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relic Console — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../relic.css">
<style>
  html, body { height: 100%; margin: 0; background: var(--ris-void); overflow: hidden; }
  #root { position: absolute; inset: 0; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--ris-line-strong); }
  ::-webkit-scrollbar-track { background: var(--ris-surface-1); }
  button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="ris">
<div id="root"></div>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Profile.jsx"></script>
<script type="text/babel" src="Baseline.jsx"></script>
<script type="text/babel" src="Gumi.jsx"></script>
<script type="text/babel" src="Chronicle.jsx"></script>
<script type="text/babel" src="AlertModal.jsx"></script>

<script type="text/babel" data-presets="react">
(() => {
const { useState, useEffect } = React;

const FEED = [
  { ts: '07:42:01', tag: 'OK',   color: 'var(--ris-green)', msg: 'Weekly check-in delivered · SUBJ-0104' },
  { ts: '07:42:08', tag: 'SCAN', color: 'var(--ris-cyan)',  msg: 'Facet "Withdrawal" recalibrated 0.48 → 0.52' },
  { ts: '07:42:15', tag: 'WARN', color: 'var(--ris-amber)', msg: 'Hypothesis queued for researcher review' },
  { ts: '07:42:19', tag: 'FAIL', color: 'var(--ris-red)',   msg: 'Gumi boundary probe blocked by safety policy' },
  { ts: '07:42:26', tag: 'SCAN', color: 'var(--ris-cyan)',  msg: 'Evidence EV-3391 ingested · 41ms' },
  { ts: '07:42:33', tag: 'OK',   color: 'var(--ris-green)', msg: 'Baseline v3 signed off · SUBJ-0091' },
  { ts: '07:42:40', tag: 'WARN', color: 'var(--ris-amber)', msg: 'Model drift 11% · review recommended' },
  { ts: '07:42:48', tag: 'FAIL', color: 'var(--ris-red)',   msg: 'Ingest failed · evidence record EV-3380' },
  { ts: '07:42:55', tag: 'OK',   color: 'var(--ris-green)', msg: 'Correction applied · goal flagged speculative' },
];

const SUBJECTS = ['SUBJ-0091', 'SUBJ-0104', 'SUBJ-0117', 'SUBJ-0122'];

const TITLES = {
  dashboard: ['ROOT', 'STUDY', 'OVERVIEW'],
  profile:   ['ROOT', 'SUBJECT', 'INTELLIGENCE'],
  baseline:  ['ROOT', 'SUBJECT', 'BASELINE'],
  gumi:      ['ROOT', 'SUBJECT', 'GUMI'],
  chronicle: ['ROOT', 'SUBJECT', 'CHRONICLE'],
};
const SUBJECT_SCOPED = ['profile', 'baseline', 'gumi', 'chronicle'];

function App() {
  const [booted, setBooted] = useState(false);
  const [screen, setScreen] = useState('dashboard');
  const [subject, setSubject] = useState('SUBJ-0104');
  const [confirm, setConfirm] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    const onKey = e => { if (!booted && (e.key === 'f' || e.key === 'F')) setBooted(true); };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey);
  }, [booted]);

  useEffect(() => { window.lucide && window.lucide.createIcons(); });

  const doConfirm = () => {
    setConfirm(null);
    setToast('SESSION ENDED · re-auth required');
    setTimeout(() => { setToast(null); setBooted(false); }, 1800);
  };

  if (!booted) return <BootScreen onJackIn={() => setBooted(true)} />;

  return (
    <Shell active={screen} onNav={setScreen} breadcrumb={TITLES[screen]} onAlert={() => setConfirm({ name: 'this session' })}>
      {SUBJECT_SCOPED.includes(screen) && <SubjectBar subjects={SUBJECTS} current={subject} onSwitch={setSubject} />}
      {screen === 'dashboard' && <Dashboard feed={FEED} />}
      {screen === 'profile'   && <Profile key={subject} />}
      {screen === 'baseline'  && <Baseline key={subject} />}
      {screen === 'gumi'      && <Gumi key={subject} />}
      {screen === 'chronicle' && <Chronicle key={subject} />}

      <AlertModal item={confirm} onCancel={() => setConfirm(null)} onConfirm={doConfirm} />

      {toast && (
        <div style={{ position: 'absolute', right: 20, bottom: 20, zIndex: 60, display: 'flex', alignItems: 'center', gap: 10, padding: '11px 14px', background: 'var(--ris-surface-2)', border: '1px solid var(--ris-line-strong)', borderLeft: '3px solid var(--ris-amber)', clipPath: CLIP(8) }}>
          <Icon name="power" size={15} color="var(--ris-amber)" />
          <div>
            <div style={{ fontFamily: 'var(--ris-font-body)', fontSize: 11, fontWeight: 600, letterSpacing: '.04em', textTransform: 'uppercase', color: 'var(--ris-fg1)' }}>Workbench Locked</div>
            <div style={{ fontFamily: 'var(--ris-font-mono)', fontSize: 10, color: '#98a3a5' }}>{toast}</div>
          </div>
        </div>
      )}
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script>
</body>
</html>
