<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relic Workbench — Mobile</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../relic.css">
<style>
  html, body { height: 100%; margin: 0; background: var(--ris-void); overflow: hidden; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* phone bezel */
  .phone {
    position: relative; width: 390px; height: 844px;
    background: #000; border: 1px solid var(--ris-line-strong);
    padding: 10px;
    box-shadow: 0 0 0 2px #0c0f11, 0 30px 80px rgba(0,0,0,.7), var(--ris-glow-cyan);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
  }
  .screen {
    position: relative; width: 100%; height: 100%; overflow: hidden;
    background: var(--ris-bg); border: 1px solid var(--ris-line);
  }
  /* camera notch */
  .notch { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: #1a1f22; border: 1px solid var(--ris-line-strong); z-index: 30; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="ris">
<div id="stage">
  <div class="phone" id="phone">
    <div class="notch"></div>
    <div class="screen"><div id="root" style="height:100%"></div></div>
  </div>
</div>

<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="MobileApp.jsx"></script>
<script type="text/babel" data-presets="react">
(function mount(){
  if (typeof MobileApp === 'undefined' || typeof Calibration === 'undefined') { setTimeout(mount, 30); return; }
  ReactDOM.createRoot(document.getElementById('root')).render(<MobileApp />);
})();

// scale phone to fit viewport height
function fit() {
  const phone = document.getElementById('phone');
  const pad = 40;
  const scale = Math.min(1, (window.innerHeight - pad) / 844, (window.innerWidth - pad) / 390);
  phone.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fit); fit();
</script>
</body>
</html>
