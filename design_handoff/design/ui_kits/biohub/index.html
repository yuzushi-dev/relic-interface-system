<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioHub — RIS Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="../../relic.css">
<style>
  html, body { height: 100%; margin: 0; background: var(--ris-void); overflow: hidden; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .phone { position: relative; width: 390px; height: 844px; background: #000; border: 1px solid var(--ris-line-strong); padding: 10px;
    box-shadow: 0 0 0 2px #0c0f11, 0 30px 80px rgba(0,0,0,.7); clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
  .screen { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ris-bg); display: flex; flex-direction: column; }
  .notch { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); width: 8px; height: 8px; border-radius: 50%; background: #1a1f22; border: 1px solid var(--ris-line-strong); z-index: 30; }
  ::-webkit-scrollbar { width: 0; }
  button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="charts.js"></script>
</head>
<body class="ris">
<div id="stage"><div class="phone" id="phone"><div class="notch"></div><div class="screen"><div id="root" style="height:100%;display:flex;flex-direction:column"></div></div></div></div>

<script type="text/babel" src="BioComponents.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Inspector.jsx"></script>
<script type="text/babel" src="Muse.jsx"></script>
<script type="text/babel" src="Sync.jsx"></script>
<script type="text/babel" src="Scale.jsx"></script>
<script type="text/babel" src="Export.jsx"></script>
<script type="text/babel" src="Import.jsx"></script>
<script type="text/babel" data-presets="react">
(() => {
const { useState, useEffect } = React;
const TITLES = {
  dashboard: ['BioHub', 'DASHBOARD SALUTE · SYNCED 07:41'],
  inspector: ['Inspector', 'health metrics + sleep'],
  muse: ['Muse Recorder', 'EEG · BLE / OSC'],
  sync: ['Health Connect', 'sync · permessi · cronologia'],
  scale: ['Bilancia', 'composizione corporea · BIA'],
  data: ['Data', 'export / import'],
};
function App() {
  const [screen, setScreen] = useState('dashboard');
  useEffect(() => { window.lucide && window.lucide.createIcons(); });
  const [t, s] = TITLES[screen];
  const right = screen === 'dashboard'
    ? <div style={{ display: 'flex', gap: 8 }}>
        <button onClick={() => setScreen('sync')} style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--ris-surface-2)', border: '1px solid var(--ris-line-strong)', color: 'var(--ris-cyan)', cursor: 'pointer', clipPath: clip(6) }}><Ico name="refresh-cw" size={16} /></button>
        <button onClick={() => setScreen('muse')} style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--ris-surface-2)', border: '1px solid var(--ris-line-strong)', color: 'var(--ris-magenta)', cursor: 'pointer', clipPath: clip(6) }}><Ico name="brain" size={16} /></button>
      </div>
    : null;
  // 'scale' is a drill-down: show a back chevron, keep Dashboard tab active in nav
  const navActive = screen === 'scale' ? 'dashboard' : screen;
  return (
    <>
      <StatusBar name="BIOHUB" />
      <BioTopBar title={t} sub={s} right={right} />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
        {screen === 'dashboard' && <BioDashboard onScale={() => setScreen('scale')} />}
        {screen === 'inspector' && <BioInspector />}
        {screen === 'muse' && <BioMuse />}
        {screen === 'sync' && <BioSync />}
        {screen === 'scale' && <BioScale onBack={() => setScreen('dashboard')} />}
        {screen === 'data' && <BioData />}
      </div>
      <BioBottomNav active={navActive} onNav={setScreen} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
function fit(){ const p=document.getElementById('phone'); const sc=Math.min(1,(window.innerHeight-40)/844,(window.innerWidth-40)/390); p.style.transform='scale('+sc+')'; }
window.addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
